services:
  postgres:
    image: postgres:16-alpine
    container_name: hajpogodi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hajpogodi
      POSTGRES_PASSWORD: hajpogodi
      POSTGRES_DB: hajpogodi
    ports:
      # Vezano na loopback: lozinka je javna u ovom repozitoriju, pa baza ne
      # smije biti dostupna s lokalne mreze. Za dev je ovo dovoljno.
      - '127.0.0.1:5432:5432'
    volumes:
      - hajpogodi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hajpogodi -d hajpogodi']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hajpogodi-pgdata:
